org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dhttp.keepAlive=false -Dsun.net.client.defaultConnectTimeout=600000 -Dsun.net.client.defaultReadTimeout=600000 -Djava.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx4G -XX:+UseParallelGC -Dkotlin.daemon.client.alive.check.resend.interval.ms=5000

org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.disableAgpUpgradePrompt=true
android.builtInKotlin=true

# kotlin 2.0
ksp.useKSP2=true
android.lint.useK2Uast=true

# optimize resources
android.nonTransitiveRClass=true
android.enableResourceOptimizations=true
android.uniquePackageNames=true
android.enableAppCompileTimeRClass=true
android.experimental.enableNewResourceShrinker=true
android.r8.optimizedResourceShrinking=true
